kind = "web"
previewPath = "/"
title = "DIGS JobTrack"
description = "A mobile-first field installation operations app for receiving, organizing, contacting, scheduling, completing, and reporting MTN ODU installation jobs."
version = "1.0.0"
id = "artifacts/digs-jobtrack"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23078

[services.development]
run = "pnpm --filter @workspace/digs-jobtrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digs-jobtrack", "run", "build" ]
serve = "static"
publicDir = "artifacts/digs-jobtrack/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23078"
BASE_PATH = "/"
